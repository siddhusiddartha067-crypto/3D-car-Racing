
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury 3D Car Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b16;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{position:fixed;inset:0}
canvas{display:block}
.panel{
 position:fixed;z-index:5;background:#101a2cdd;
 border:1px solid #536a91;border-radius:14px;
 padding:14px;backdrop-filter:blur(10px)
}
#top{top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#garage{top:80px;left:50%;transform:translateX(-50%);width:min(94%,650px);max-height:78vh;overflow:auto;text-align:center}
#garage h1{color:#ffd45e;margin:5px}
.cars{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}
.carOption{background:#1c2a42;padding:12px;border-radius:10px;border:1px solid #526787}
button,select,input{padding:10px;border:0;border-radius:8px;margin:4px;cursor:pointer}
button{background:#ffc94d;color:#101522;font-weight:bold}
button:disabled{opacity:.4;cursor:not-allowed}
.secondary{background:#344b6d;color:white}
#custom{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
#gameover{display:none;inset:0;margin:auto;width:min(90%,400px);height:max-content;text-align:center}
#hud{top:75px;left:10px;pointer-events:none}
#nitroBox{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:4;width:190px;text-align:center}
#nitro{height:12px;background:#26354d;border-radius:10px;overflow:hidden}
#nitroFill{height:100%;width:100%;background:#00d9ff}
#controls{position:fixed;bottom:20px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}
#controls button{pointer-events:auto;width:65px;height:55px;font-size:22px;background:#ffffffcc}
#garageInfo{color:#cbd8eb;font-size:13px}
@media(max-width:500px){.cars{grid-template-columns:1fr 1fr}#garage{top:90px}}
</style>
</head>
<body>
<div id="game"></div>

<div id="top" class="panel">
 <b>🏎️ LUXURY RACING</b>
 <span>🪙 Coins: <b id="wallet">0</b></span>
 <span>💎 Diamonds: <b id="diamonds">0</b></span>
 <button onclick="showGarage()">GARAGE</button>
</div>

<div id="hud" class="panel" style="display:none">
 <div>🏁 Score: <b id="score">0</b></div>
 <div>🪙 Race Coins: <b id="raceCoins">0</b></div>
 <div>💎 Race Diamonds: <b id="raceDiamonds">0</b></div>
 <div>⚡ Nitro: <span id="nitroText">100%</span></div>
</div>

<div id="garage" class="panel">
 <h1>💎 LUXURY GARAGE</h1>
 <p>Choose your dream supercar</p>
 <div class="cars" id="carList"></div>
 <div id="custom">
  <label>🎨 Paint <input type="color" id="paint" value="#e52222"></label>
  <label>🛞 Wheels
   <select id="wheelColor">
    <option value="#171b25">Black</option>
    <option value="#c4cbd6">Silver</option>
    <option value="#d9a52b">Gold</option>
    <option value="#d52a2a">Red</option>
   </select>
  </label>
 </div>
 <p id="garageInfo">Drag the screen to rotate your car preview.</p>
 <button onclick="startGame()">🏁 START RACING</button>
 <button class="secondary" onclick="rotatePreview()">🔄 Rotate 360°</button>
</div>

<div id="gameover" class="panel">
 <h1>🏆 RACE OVER</h1>
 <p>Your Score: <b id="finalScore">0</b></p>
 <p>Coins Earned: <b id="finalCoins">0</b></p>
 <p>Diamonds: <b id="finalDiamonds">0</b></p>
 <button onclick="startGame()">PLAY AGAIN</button>
 <button class="secondary" onclick="showGarage()">GARAGE</button>
</div>

<div id="nitroBox" style="display:none">
 <div>⚡ NITRO (Hold Space)</div>
 <div id="nitro"><div id="nitroFill"></div></div>
</div>

<div id="controls" style="display:none">
 <button id="left">⬅</button><button id="right">➡</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const cars=[
 {name:"Red Beast",cost:0,color:"#e52222"},
 {name:"Blue Thunder",cost:100,color:"#147bff"},
 {name:"Yellow Speed",cost:250,color:"#ffd22e"},
 {name:"Black Shadow",cost:500,color:"#333943"},
 {name:"White Phantom",cost:1000,color:"#eeeeee"}
];
let wallet=Number(localStorage.luxuryCoins||0);
let unlocked=JSON.parse(localStorage.luxuryUnlocked||"[0]");
let selected=0,scene,camera,renderer,player,road;
let traffic=[],pickups=[],running=false,garageVisible=true;
let score=0,raceCoins=0,raceDiamonds=0,nitro=100;
let left=false,right=false,boost=false,previewAngle=0;
let lastTime=0,spawnTimer=0,pickupTimer=0;

function save(){
 localStorage.luxuryCoins=wallet;
 localStorage.luxuryUnlocked=JSON.stringify(unlocked);
}
function updateWallet(){
 $("wallet").textContent=wallet;
 $("diamonds").textContent=Number(localStorage.totalDiamonds||0);
}
function makeCar(color,wheel="#171b25"){
 const g=new THREE.Group();
 const paint=new THREE.MeshStandardMaterial({color,metalness:.7,roughness:.25});
 const dark=new THREE.MeshStandardMaterial({color:0x101827,metalness:.3,roughness:.4});
 const glass=new THREE.MeshStandardMaterial({color:0x6ca9d4,metalness:.6,roughness:.15});
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.5,.48,2.9),paint);
 body.position.y=.65;g.add(body);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.12,.55,1.35),glass);
 cabin.position.set(0,1.12,-.15);g.add(cabin);
 const hood=new THREE.Mesh(new THREE.BoxGeometry(1.3,.12,.65),paint);
 hood.position.set(0,.9,1);g.add(hood);
 const bumper=new THREE.Mesh(new THREE.BoxGeometry(1.5,.18,.2),dark);
 bumper.position.set(0,.43,1.48);g.add(bumper);
 for(let x of [-.82,.82]){
  for(let z of [-.9,.9]){
   const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(.34,.34,.2,20),
    new THREE.MeshStandardMaterial({color:wheel,metalness:.7,roughness:.3})
   );
   tire.rotation.z=Math.PI/2;tire.position.set(x,.4,z);g.add(tire);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.21,16),
    new THREE.MeshStandardMaterial({color:0xcccccc,metalness:.9}));
   hub.rotation.z=Math.PI/2;hub.position.set(x,.4,z);g.add(hub);
  }
 }
 const lightMat=new THREE.MeshBasicMaterial({color:0xffffff});
 for(let x of [-.48,.48]){
  const light=new THREE.Mesh(new THREE.BoxGeometry(.3,.12,.06),lightMat);
  light.position.set(x,.72,1.48);g.add(light);
 }
 return g;
}
function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x070d1c);
 scene.fog=new THREE.Fog(0x070d1c,25,100);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
 camera.position.set(0,6,11);
 camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 $("game").appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xb9d7ff,0x182030,2));
 const sun=new THREE.DirectionalLight(0xffffff,3);
 sun.position.set(-5,12,7);sun.castShadow=true;scene.add(sun);
 const blue=new THREE.PointLight(0x168cff,30,30);
 blue.position.set(-7,5,0);scene.add(blue);
 const pink=new THREE.PointLight(0xff25ae,25,30);
 pink.position.set(7,5,0);scene.add(pink);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x141c2b,roughness:.8}));
 floor.rotation.x=-Math.PI/2;floor.position.y=-.03;scene.add(floor);
 road=new THREE.Group();scene.add(road);
 const asphalt=new THREE.Mesh(new THREE.PlaneGeometry(10,180),
  new THREE.MeshStandardMaterial({color:0x252b37,roughness:.9}));
 asphalt.rotation.x=-Math.PI/2;asphalt.position.y=.01;road.add(asphalt);
 for(let x of [-5,5]){
  const edge=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,180),
   new THREE.MeshBasicMaterial({color:0x00d9ff}));
  edge.position.set(x,.08,0);road.add(edge);
 }
 for(let z=-85;z<90;z+=8){
  const dash=new THREE.Mesh(new THREE.BoxGeometry(.12,.03,3),
   new THREE.MeshBasicMaterial({color:0xffffff}));
  dash.position.set(0,.06,z);road.add(dash);
 }
 player=makeCar(cars[0].color);
 player.position.set(0,0,4);scene.add(player);
 window.addEventListener("resize",resize);
 animate(0);
}
function resize(){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
function clearObjects(arr){
 for(const o of arr)scene.remove(o.mesh);
 arr.length=0;
}
function showGarage(){
 running=false;garageVisible=true;
 $("garage").style.display="block";
 $("gameover").style.display="none";
 $("hud").style.display="none";
 $("nitroBox").style.display="none";
 $("controls").style.display="none";
 clearObjects(traffic);clearObjects(pickups);
 if(player)scene.remove(player);
 player=makeCar(cars[selected].color,$("wheelColor").value);
 player.position.set(0,0,4);scene.add(player);
 camera.position.set(0,5,11);camera.lookAt(0,.6,0);
 renderCars();updateWallet();
}
function renderCars(){
 $("carList").innerHTML="";
 cars.forEach((car,i)=>{
  const box=document.createElement("div");box.className="carOption";
  const open=unlocked.includes(i);
  box.innerHTML=`<b>${car.name}</b><br>🪙 ${car.cost===0?"FREE":car.cost}<br>
  <button>${open?(selected===i?"SELECTED":"SELECT"):"🔒 UNLOCK"}</button>`;
  const btn=box.querySelector("button");
  btn.onclick=()=>{
   if(!open){
    if(wallet<car.cost){alert("Not enough coins! Collect more coins while racing.");return}
    wallet-=car.cost;unlocked.push(i);save();
   }
   selected=i;
   playerColor();
   renderCars();updateWallet();
  };
  $("carList").appendChild(box);
 });
}
function playerColor(){
 scene.remove(player);
 player=makeCar($("paint").value,$("wheelColor").value);
 player.position.set(0,0,4);scene.add(player);
}
$("paint").addEventListener("input",playerColor);
$("wheelColor").addEventListener("change",playerColor);
function rotatePreview(){previewAngle+=Math.PI*2; }
function startGame(){
 $("garage").style.display="none";$("gameover").style.display="none";
 $("hud").style.display="block";$("nitroBox").style.display="block";
 $("controls").style.display="flex";
 garageVisible=false;running=true;
 clearObjects(traffic);clearObjects(pickups);
 scene.remove(player);
 player=makeCar($("paint").value,$("wheelColor").value);
 player.position.set(0,0,4);scene.add(player);
 score=0;raceCoins=0;raceDiamonds=0;nitro=100;
 spawnTimer=0;pickupTimer=0;
 updateHUD();
}
function updateHUD(){
 $("score").textContent=score;
 $("raceCoins").textContent=raceCoins;
 $("raceDiamonds").textContent=raceDiamonds;
 $("nitroText").textContent=Math.round(nitro)+"%";
 $("nitroFill").style.width=nitro+"%";
}
function makeTraffic(){
 const colors=[0xff3333,0x168cff,0xffcc22,0xdddddd];
 const mesh=makeCar(colors[Math.floor(Math.random()*colors.length)]);
 const lane=[-3,0,3][Math.floor(Math.random()*3)];
 mesh.position.set(lane,0,-75);
 scene.add(mesh);traffic.push({mesh,speed:17+Math.random()*8});
}
function makePickup(){
 const diamond=Math.random()<.23;
 const mesh=new THREE.Mesh(
  diamond?new THREE.OctahedronGeometry(.55):new THREE.TorusGeometry(.45,.15,10,20),
  new THREE.MeshStandardMaterial({
   color:diamond?0x00eaff:0xffd32e,emissive:diamond?0x006caa:0x9c6500,
   metalness:.7,roughness:.2
  })
 );
 const lane=[-3,0,3][Math.floor(Math.random()*3)];
 mesh.position.set(lane,1,-75);scene.add(mesh);
 pickups.push({mesh,diamond});
}
function endGame(){
 running=false;
 wallet+=raceCoins;save();updateWallet();
 $("finalScore").textContent=score;
 $("finalCoins").textContent=raceCoins;
 $("finalDiamonds").textContent=raceDiamonds;
 $("gameover").style.display="block";
 $("nitroBox").style.display="none";$("controls").style.display="none";
}
function animate(time){
 requestAnimationFrame(animate);
 const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;
 if(player){
  if(garageVisible){
   player.rotation.y+=dt*.45;
   camera.lookAt(0,.7,0);
  }
  if(running){
   const speed=boost&&nitro>0?34:20;
   if(boost&&nitro>0)nitro=Math.max(0,nitro-35*dt);
   else nitro=Math.min(100,nitro+12*dt);
   if(left)player.position.x-=8*dt;
   if(right)player.position.x+=8*dt;
   player.position.x=Math.max(-4,Math.min(4,player.position.x));
   player.rotation.z=left?.12:right?-.12:0;
   score+=Math.floor(speed*dt);
   spawnTimer+=dt;pickupTimer+=dt;
   if(spawnTimer>1.2){makeTraffic();spawnTimer=0}
   if(pickupTimer>1.0){makePickup();pickupTimer=0}
   for(let i=traffic.length-1;i>=0;i--){
    const t=traffic[i];t.mesh.position.z+=t.speed*dt;
    if(Math.abs(t.mesh.position.x-player.position.x)<1.25&&
       Math.abs(t.mesh.position.z-player.position.z)<2.1){endGame();break}
    if(t.mesh.position.z>15){scene.remove(t.mesh);traffic.splice(i,1)}
   }
   for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.mesh.position.z+=20*dt;p.mesh.rotation.y+=dt*2;
    if(Math.abs(p.mesh.position.x-player.position.x)<1.2&&
       Math.abs(p.mesh.position.z-player.position.z)<1.8){
      if(p.diamond){
       raceDiamonds++;localStorage.totalDiamonds=Number(localStorage.totalDiamonds||0)+1;
      }else raceCoins+=10;
      scene.remove(p.mesh);pickups.splice(i,1);
    }else if(p.mesh.position.z>15){
     scene.remove(p.mesh);pickups.splice(i,1);
    }
   }
   updateHUD();
  }
 }
 renderer.render(scene,camera);
}
function bindHold(id,down,up){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();down()});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,up));
}
bindHold("left",()=>left=true,()=>left=false);
bindHold("right",()=>right=true,()=>right=false);
window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=true;
 if(e.code==="Space")boost=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=false;
 if(e.code==="Space")boost=false;
});
let dragX=null;
document.addEventListener("pointerdown",e=>{dragX=e.clientX});
document.addEventListener("pointerup",()=>{dragX=null});
document.addEventListener("pointermove",e=>{
 if(dragX!==null&&garageVisible){
  const dx=e.clientX-dragX;player.rotation.y+=dx*.012;dragX=e.clientX;
 }
});
init();showGarage();
</script>
</body>
</html>
